name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Weekly validation of main without changes: Monday 08:27 KST (validation health, ADR 0022).
  schedule:
    - cron: '27 23 * * 0'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  MIX_ENV: test
jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres tests (ADR 0021, decision 9) fail instead of being skipped when the service is down.
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/archon_test
      ARCHON_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      # The runtime tests again on the Postgres backend (ADR 0021, decision 9).
      - run: mix test
        env:
          ARCHON_BACKEND: postgres

  # archon_js under AddressSanitizer, UndefinedBehaviorSanitizer and LeakSanitizer (ADR 0015).
  # Every job already builds archon_js with warnings as errors through `mix compile`.
  c-sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
      - run: make ARCHON_JS_SANITIZE=1
      - run: >-
          mix test test/archon/script_test.exs test/archon/script/pool_test.exs
          test/archon/decider/mapper_test.exs test/archon/domain/task_type_constraint_test.exs
        env:
          ARCHON_JS_EXECUTABLE: priv/archon_js-sanitize
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  credo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
      # Compile first so dependency build output doesn't land in the SARIF file.
      - run: mix compile
      - run: mix credo --strict --format sarif > credo.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('credo.sarif') != ''
        with:
          sarif_file: credo.sarif
          category: credo

  dialyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
        id: elixir
      - uses: actions/cache/restore@v6
        id: plt
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.elixir.outputs.otp-version }}-${{ steps.elixir.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.elixir.outputs.otp-version }}-${{ steps.elixir.outputs.elixir-version }}-
      - run: mix dialyzer --plt
      - uses: actions/cache/save@v6
        if: steps.plt.outputs.cache-hit != 'true'
        with:
          path: priv/plts
          key: ${{ steps.plt.outputs.cache-primary-key }}
      - run: mix dialyzer --format github

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
      - run: mix hex.audit
      - run: mix deps.audit
