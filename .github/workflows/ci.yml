name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  MIX_ENV: test
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      # Codex review gate script (.github/workflows/codex-review-gate.yml); the runner ships python3.
      - run: python3 -m unittest discover -s scripts/tests -v

  credo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
      # Compile first so dependency build output doesn't land in the SARIF file.
      - run: mix compile
      - run: mix credo --strict --format sarif > credo.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('credo.sarif') != ''
        with:
          sarif_file: credo.sarif
          category: credo

  dialyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
        id: elixir
      - uses: actions/cache/restore@v6
        id: plt
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.elixir.outputs.otp-version }}-${{ steps.elixir.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.elixir.outputs.otp-version }}-${{ steps.elixir.outputs.elixir-version }}-
      - run: mix dialyzer --plt
      - uses: actions/cache/save@v6
        if: steps.plt.outputs.cache-hit != 'true'
        with:
          path: priv/plts
          key: ${{ steps.plt.outputs.cache-primary-key }}
      - run: mix dialyzer --format github

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
      - run: mix hex.audit
      - run: mix deps.audit
